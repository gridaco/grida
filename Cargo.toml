[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/gridaco/grida"
publish = false

[workspace.dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
unicode-general-category = "1.1.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Unoptimized host executables packed as local release-shaped fixtures. Without
# embedded debug info they stay within the release package's executable bound
# on every OS, as the macOS debug build already does.
[profile.fixture]
inherits = "dev"
debug = false
strip = "debuginfo"

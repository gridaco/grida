<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <title>Grida FX workflows</title>
  <defs>
    <linearGradient id="wire" x1="47" x2="264" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b3b3b" />
      <stop offset=".3" stop-color="#292929" />
      <stop offset=".38" stop-color="#060606" />
      <stop offset=".67" stop-color="#060606" />
      <stop offset=".78" stop-color="#292929" />
      <stop offset="1" stop-color="#3b3b3b" />
    </linearGradient>
    <linearGradient id="pulse">
      <stop stop-color="white" stop-opacity="0" />
      <stop offset=".75" stop-color="white" stop-opacity=".7" />
      <stop offset="1" stop-color="white" stop-opacity="0" />
    </linearGradient>
    <mask id="signal" maskUnits="userSpaceOnUse" x="45" y="60" width="220" height="60">
      <rect id="still" x="12" y="60" width="40" height="60" fill="url(#pulse)" />
    </mask>
  </defs>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      #still:not(:target) { animation: trace 3.6s linear infinite; }
    }
    @keyframes trace {
      from { transform: translateX(0); }
      65%, to { transform: translateX(250px); }
    }
  </style>
  <rect width="320" height="180" fill="#000" />

  <!-- A single input branches into two outputs behind the FX mark. -->
  <g stroke="url(#wire)" stroke-width="1.25" fill="none">
    <path id="circuit" d="M53 103h16c17 0 15-13 32-13h102c19 0 16-25 36-25h20 M203 90c19 0 16 24 36 24h20" />
    <use href="#circuit" stroke="#bfbfbf" mask="url(#signal)" />
    <g fill="#111" stroke="#505050">
      <rect x="44" y="98.5" width="9" height="9" rx="2" />
      <rect x="259" y="60.5" width="9" height="9" rx="2" />
      <rect x="259" y="109.5" width="9" height="9" rx="2" />
    </g>
  </g>


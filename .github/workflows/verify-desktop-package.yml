permissions:
  contents: read

name: Verify Desktop Package

# Builds unsigned installers on each supported target without publishing.
# Forge verifies the package's runtime dependency closure and runs the bundled
# native executable on that target before handing the package to its makers.
on:
  pull_request:
    paths:
      - "desktop/**"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "skills/**"
      - "scripts/cli-release/native*.mjs"
      - "packages/grida-ai-agent/**"
      - "packages/grida-ai/**"
      - "packages/grida-daemon/**"
      - "packages/grida-auth/**"
      - "data/ai/**"
      - "packages/grida-desktop-bridge/**"
      - "packages/grida-home/**"
      - ".github/workflows/realease-desktop-app.yml"
      - ".github/workflows/verify-desktop-package.yml"
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu-24.04
            arch: x64
          - image: ubuntu-24.04-arm
            arch: arm64
          - image: windows-latest
            arch: x64
          - image: macos-26
            arch: arm64
          - image: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.image }}
    defaults:
      run:
        working-directory: ./desktop

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify linked package and archive guards
        run: pnpm exec vitest run scripts/linked-packages.test.ts vite.guards.test.ts forge.config.test.ts

      - name: Build linked workspace packages
        # The desktop bundles several @grida/* workspace packages whose dist/ is
        # gitignored; build their closure from the repo root so the Vite build
        # can resolve them. `shell: bash` so the `\` continuations work on the
        # Windows runner (default shell is PowerShell). Mirrors the publish
        # workflow's step.
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm turbo run build \
            --filter=@grida/desktop-bridge \
            --filter=@grida/agent \
            --filter=@grida/daemon \
            --filter=@grida/home

      - name: Verify package and make unsigned installers
        run: pnpm run make --arch="${{ matrix.arch }}"

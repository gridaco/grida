name: Publish Packages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grida-workspace-release
  cancel-in-progress: false

jobs:
  # The wasm build steps left with the engine repo (it owns @grida/canvas-wasm
  # publishing); this job now only publishes the JS workspace packages.
  publish-packages:
    if: github.repository == 'gridaco/grida' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Deno for package generation hooks
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify independent CLI publication stays excluded
        run: node --test scripts/publish-packages.test.mjs

      - name: Configure Git for Changesets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Publish Packages through GitHub OIDC
        run: pnpm publish-packages
        # Each npm package must trust repository gridaco/grida, workflow
        # publish-packages.yml, environment npm-publish, with direct publication.
        # No static npm token or fallback; see scripts/publish-packages.md.

name: test packages

on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.mdx"
      - "branding/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test optional local Library importer
        run: python -m unittest discover -s .agents/skills/opt-library/scripts -p 'test_*.py'
      - name: Test CI change selection and release tagging
        run: node --test .github/scripts/ci-changes.test.mjs .github/scripts/npm-release-tag.test.cjs
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Packages
        # Dedicated Rust CI owns the CLI's Cargo tasks.
        run: pnpm turbo build --filter='./packages/*' --filter='!grida'
      - name: Run Typecheck
        run: pnpm turbo typecheck --filter='!grida'
      - name: Run Lint
        run: pnpm lint
      - name: Verify independent AI package exports, types and authority
        run: pnpm --filter @grida/ai test:package
      - name: Run Tests
        # Each package starts its own parallel test workers. Limit CPU and memory
        # contention between package worker pools on the shared runner.
        run: pnpm turbo test --filter='!grida' --concurrency=2

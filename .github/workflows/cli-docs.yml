name: CLI documentation

on:
  pull_request:
    paths:
      - "docs/cli/**"
      - "docs/index.md"
      - "docs/translations/**/index.md"
      - "docs/AGENTS.md"
      - "apps/docs/**"
      - "packages/grida-cli/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "scripts/conformance/**"
      - "packages/grida-ai/**"
      - "packages/grida-ai-models/**"
      - "data/ai/**"
      - "packages/grida-auth/**"
      - "packages/grida-account/**"
      - "packages/grida-home/**"
      - "scripts/cli-docs/**"
      - "scripts/cli-release/**"
      - "scripts/npm.mjs"
      - "scripts/cli-local/network.cjs"
      - "fixtures/images/checker.png"
      - "editor/next.config.ts"
      - ".github/workflows/cli-docs.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
  workflow_dispatch:
  workflow_call:
    inputs:
      native_candidate_artifact:
        description: Exact native candidate artifact from the platform build matrix.
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: cli-docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: true
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build current command and schema contracts
        run: |
          pnpm --filter @grida/ai... build
          node scripts/conformance/prepare.mjs
      - name: Build documentation
        run: pnpm --filter docs build
      - name: Check example parsing and translation cleanup
        run: |
          node --import tsx --test scripts/cli-docs/check.test.mjs
          node --test apps/docs/scripts/docs-site-gen/copy-translations.test.cjs
      - name: Check the current preview against its documentation
        if: inputs.native_candidate_artifact == ''
        env:
          GRIDA_CLI_DOCS_SUDO_NETWORK: "1"
        run: |
          cargo build --locked -p grida-cli --bin grida
          node scripts/cli-release/native-fixture.mjs --binary "$PWD/target/debug/grida" --out "$RUNNER_TEMP/grida-docs-native"
          node --import tsx scripts/cli-docs/check.mjs --native-candidate "$RUNNER_TEMP/grida-docs-native"
      - name: Download exact native release candidate
        if: inputs.native_candidate_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.native_candidate_artifact }}
          path: ${{ runner.temp }}/grida-docs-native
      - name: Check the installed native release against documentation with networking disabled
        if: inputs.native_candidate_artifact != ''
        env:
          GRIDA_CLI_DOCS_SUDO_NETWORK: "1"
        run: node --import tsx scripts/cli-docs/check.mjs --native-candidate "$RUNNER_TEMP/grida-docs-native"

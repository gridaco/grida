name: CLI documentation

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      force_full:
        type: boolean
        default: true
      native_candidate_artifact:
        description: Exact native candidate artifact from the platform build matrix.
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: cli-docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml
    with:
      force_full: ${{ inputs.force_full == true || github.event_name == 'workflow_dispatch' }}
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build current command and schema contracts
        run: cargo build --locked -p grida-cli --features conformance --bin grida-conformance
      - name: Build documentation
        run: pnpm --filter docs build
      - name: Check example parsing and translation cleanup
        run: |
          node --test scripts/cli-docs/check.test.mjs
          node --test apps/docs/scripts/docs-site-gen/copy-translations.test.cjs
      - name: Check the current preview against its documentation
        if: inputs.native_candidate_artifact == ''
        env:
          GRIDA_CLI_DOCS_SUDO_NETWORK: "1"
        run: |
          cargo build --locked -p grida-cli --bin grida
          node scripts/cli-release/native-fixture.mjs --binary "$PWD/target/debug/grida" --out "$RUNNER_TEMP/grida-docs-native"
          node scripts/cli-docs/check.mjs --native-candidate "$RUNNER_TEMP/grida-docs-native"
      - name: Download exact native release candidate
        if: inputs.native_candidate_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.native_candidate_artifact }}
          path: ${{ runner.temp }}/grida-docs-native
      - name: Check the installed native release against documentation with networking disabled
        if: inputs.native_candidate_artifact != ''
        env:
          GRIDA_CLI_DOCS_SUDO_NETWORK: "1"
        run: node scripts/cli-docs/check.mjs --native-candidate "$RUNNER_TEMP/grida-docs-native"
  verify:
    name: CLI documentation verification
    if: always()
    needs: [changes, docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require successful selected checks
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node .github/scripts/ci-changes.mjs --verify docs=docs

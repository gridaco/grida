name: Rust

on:
  workflow_call:
    inputs:
      force_full:
        description: Reusable callers (including releases) verify every input by default.
        type: boolean
        default: true
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml
    with:
      force_full: ${{ inputs.force_full == true || github.event_name == 'workflow_dispatch' }}
  check:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features --locked
      - name: Build
        run: cargo build --workspace --locked
  conformance:
    needs: changes
    if: needs.changes.outputs.conformance == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: rustup show active-toolchain
      - name: Install native Secret Service fixture dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dbus-x11 gnome-keyring libsecret-1-dev
      - run: pnpm install --frozen-lockfile
      - name: Build current TypeScript SDK consumers
        run: pnpm exec turbo run build --filter=@grida/ai... --filter=@grida/auth...
      - name: Build documentation for installed guide checks
        run: pnpm --filter docs build
      - name: Verify native CLI and shared contracts
        env:
          GRIDA_AUTH_KEYRING_SMOKE: "1"
          GRIDA_AUTH_MACOS_CI: ${{ runner.os == 'macOS' && '1' || '0' }}
          GRIDA_CLI_DOCS_SUDO_NETWORK: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: |
          node --test scripts/cli-contracts/cli.test.mjs scripts/cli-contracts/catalogue-request.test.mjs
          node scripts/cli-contracts/run.mjs
  verify:
    name: Rust verification
    if: always()
    needs: [changes, check, conformance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require successful selected checks
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node .github/scripts/ci-changes.mjs --verify rust=check conformance=conformance

name: Rust

on:
  workflow_call:
    inputs:
      force_full:
        description: Reusable callers (including releases) verify every input by default.
        type: boolean
        default: true
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml
    with:
      force_full: ${{ inputs.force_full == true || github.event_name == 'workflow_dispatch' }}
  check:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features --locked
      - name: Set up Node for native package-client tests
        if: runner.os != 'Windows'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Set up Python for native package-client tests
        if: runner.os != 'Windows'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Native sandbox and agent commands
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update && sudo apt-get install -y bubblewrap
            # Ubuntu restricts unprivileged user namespaces by default.
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
            export AGENT_KIT_TEST_BWRAP=/usr/bin/bwrap
          fi
          cargo test -p agent-kit-sandbox --locked --test native -- --include-ignored --test-threads=1
          cargo build -p agent-kit-sandbox --locked --bin agent-kit-sandbox-helper
          export GRIDA_AGENT_TEST_SANDBOX_HELPER="$PWD/target/debug/agent-kit-sandbox-helper"
          cargo test -p grida-agent --locked --lib confined_command_transfers_through_its_approved_broker -- --ignored
          cargo test -p grida-agent --locked --lib permissions::review_shell:: -- --include-ignored
          python3 -m venv "$RUNNER_TEMP/grida-package-tests"
          export PATH="$RUNNER_TEMP/grida-package-tests/bin:$PATH"
          python3 -m pip install --disable-pip-version-check 'uv==0.6.6'
          cargo test -p grida-agent --locked --lib processes::network::managed:: -- --ignored
          cargo test -p grida-agent --locked --test commands --test permissions --test process --test external_acp -- --include-ignored --test-threads=1
          if [ "$RUNNER_OS" = Linux ]; then
            # Give the built host a local origin with a public-class address.
            # Only this namespace can resolve or reach the fixture.
            test_bin=$(cargo test -p grida-agent --locked --test process --no-run --message-format=json |
              jq -r 'select(.target.name == "process" and .executable) | .executable')
            broker_test=approvals::reviewer::approved_network_command_uses_its_exact_destination_broker
            "$test_bin" --list --ignored --exact "$broker_test" | grep -Fx "$broker_test: test"
            fixture_hosts=$(mktemp)
            trap 'rm -f "$fixture_hosts"' EXIT
            cat /etc/hosts > "$fixture_hosts"
            echo '1.1.1.1 updates.example updates.example.' >> "$fixture_hosts"
            sudo unshare --net --mount --propagation private bash -eu -c '
              ip link set lo up
              ip address add 1.1.1.1/32 dev lo
              mount --bind "$1" /etc/hosts
              exec runuser -u "$2" -- env GRIDA_AGENT_TEST_BROKER_ORIGIN=1 \
                AGENT_KIT_TEST_BWRAP=/usr/bin/bwrap GRIDA_AGENT_TEST_SANDBOX_HELPER="$3" \
                "$4" "$5" --exact --ignored
            ' _ "$fixture_hosts" "$(id -un)" "$GRIDA_AGENT_TEST_SANDBOX_HELPER" "$test_bin" "$broker_test"
          fi
      - name: Build
        run: cargo build --workspace --locked
  conformance:
    needs: changes
    if: needs.changes.outputs.conformance == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: rustup show active-toolchain
      - name: Install native Secret Service fixture dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dbus-x11 gnome-keyring libsecret-1-dev
      - run: pnpm install --frozen-lockfile
      - name: Build current TypeScript SDK consumers
        run: pnpm exec turbo run build --filter=@grida/ai... --filter=@grida/auth...
      - name: Verify native CLI and shared contracts
        env:
          GRIDA_AUTH_KEYRING_SMOKE: "1"
          GRIDA_AUTH_MACOS_CI: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: |
          node --test scripts/cli-contracts/cli.test.mjs scripts/cli-contracts/catalogue-request.test.mjs
          node scripts/cli-contracts/run.mjs
  verify:
    name: Rust verification
    if: always()
    needs: [changes, check, conformance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require successful selected checks
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node .github/scripts/ci-changes.mjs --verify rust=check conformance=conformance

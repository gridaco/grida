name: Verify CLI package

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      force_full:
        type: boolean
        default: true
  pull_request:

permissions:
  contents: read

concurrency:
  group: cli-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml
    with:
      force_full: ${{ inputs.force_full == true || github.event_name == 'workflow_dispatch' }}
  delivery:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    uses: ./.github/workflows/cli-native.yml
  tooling:
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify independent package publication
        run: |
          node --test scripts/publish-packages.test.mjs scripts/npm.test.mjs scripts/cli-release/native-release.test.mjs
  verify:
    name: CLI package verification
    if: always()
    needs: [changes, delivery, tooling]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require successful selected checks
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node .github/scripts/ci-changes.mjs --verify native=delivery tooling=tooling

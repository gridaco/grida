name: Verify CLI package

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - ".github/workflows/cli-*.yml"
      - ".gitattributes"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "scripts/cli-contracts/**"
      - ".changeset/config.json"
      - "packages/grida-cli/**"
      - "packages/grida-auth/**"
      - "packages/grida-account/**"
      - "packages/grida-home/**"
      - "packages/grida-ai/**"
      - "packages/grida-ai-models/**"
      - "data/ai/**"
      - "scripts/cli-release/**"
      - "scripts/cli-media-local/**"
      - "scripts/cli-local/**"
      - "scripts/npm*.mjs"
      - "scripts/publish-packages*.mjs"
      - ".github/workflows/publish-packages.yml"
      - "LICENSE"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".nvmrc"

permissions:
  contents: read

concurrency:
  group: cli-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  delivery:
    uses: ./.github/workflows/cli-native.yml
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify independent publication and retained reference instrumentation
        run: |
          node --test scripts/publish-packages.test.mjs scripts/npm.test.mjs
          node --test scripts/cli-media-local/network.test.mjs scripts/cli-local/network.test.mjs
      # Retained Node guard tests qualify only their historical instrumentation.
      # Native contracts and delivery verify the current packed executable.

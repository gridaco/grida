name: Release CLI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version already reviewed in packages/grida-cli/package.json
        required: true
        type: string
      tag:
        description: npm distribution tag (stable releases use latest)
        required: true
        type: choice
        default: latest
        options: [latest, next]

permissions:
  contents: read

concurrency:
  group: grida-cli-release
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Require main and an explicitly publishable, reviewed version
        env:
          CLI_VERSION: ${{ inputs.version }}
          CLI_TAG: ${{ inputs.tag }}
        run: |
          test "$GITHUB_REPOSITORY" = gridaco/grida
          test "$GITHUB_REF" = refs/heads/main
          node scripts/cli-release/native-publish.mjs --check-only --version "$CLI_VERSION" --tag "$CLI_TAG"
  package:
    needs: guard
    uses: ./.github/workflows/cli-native.yml
  conformance:
    needs: guard
    uses: ./.github/workflows/rust.yml
  docs:
    needs: package
    uses: ./.github/workflows/cli-docs.yml
    with:
      native_candidate_artifact: grida-native-candidate
  auth:
    needs: [guard, package]
    uses: ./.github/workflows/auth-local.yml
    with:
      native_candidate_artifact: grida-native-candidate
  api:
    needs: guard
    uses: ./.github/workflows/api.yml
  publish:
    needs: [package, conformance, docs, auth, api]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require the configured release environment
        env:
          CLI_NPM_RELEASE_ENABLED: ${{ vars.CLI_NPM_RELEASE_ENABLED }}
        run: test "$CLI_NPM_RELEASE_ENABLED" = true
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          name: grida-native-candidate
          path: ${{ runner.temp }}/grida-native-candidate
      - uses: actions/download-artifact@v4
        with:
          pattern: grida-native-installed-*
          merge-multiple: true
          path: ${{ runner.temp }}/grida-native-candidate
      - name: Verify and publish the exact tested grida archive through npm OIDC
        env:
          CLI_VERSION: ${{ inputs.version }}
          CLI_TAG: ${{ inputs.tag }}
          CLI_NPM_RELEASE_ENABLED: ${{ vars.CLI_NPM_RELEASE_ENABLED }}
        run: |
          node scripts/cli-release/native-publish.mjs --dry-run --out "$RUNNER_TEMP/grida-native-candidate" --version "$CLI_VERSION" --tag "$CLI_TAG"
          node scripts/cli-release/native-publish.mjs --out "$RUNNER_TEMP/grida-native-candidate" --version "$CLI_VERSION" --tag "$CLI_TAG"
      # No static npm token. The npm publisher must authorize this workflow and
      # npm-publish environment, including npm publish permission (not stage only).

# GRIDA-SEC-011 — reviewed disposable issuer config; dynamic registration stays off.
# Disposable auth fixture. Never link this project to a hosted project.
project_id = "grida_auth_test"

[api]
enabled = true
port = 55431
schemas = [
  "public",
  "graphql_public",
  "pgmq_public",
  "grida_ciam_public",
  "grida_library",
  "grida_www",
  "grida_g11n",
  "grida_x_supabase",
  "grida_sites",
  "grida_canvas",
  "grida_commerce",
  "grida_forms_secure",
  "grida_forms",
  "grida_storage",
  "grida_west_referral",
]
extra_search_path = ["public", "extensions"]
max_rows = 5000

[db]
port = 55432
shadow_port = 55430
major_version = 15

[db.pooler]
enabled = false
port = 55439
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = true
port = 55433
api_url = "http://127.0.0.1:55431"

[inbucket]
enabled = true
port = 55434

# Existing migrations refer to storage's baseline schema. No bucket uploads.
[storage]
enabled = true
file_size_limit = "50MiB"

[storage.image_transformation]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3041"
additional_redirect_urls = ["http://127.0.0.1:3041/oauth/consent"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"

[auth.oauth_server]
enabled = true
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = false

[edge_runtime]
enabled = false
inspector_port = 55438

[analytics]
enabled = false
port = 55437
backend = "postgres"

[package]
name = "grida-agent-master"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
agent-kit-core = { path = "../agent-kit-core" }
agent-kit-runtime = { path = "../agent-kit-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
agent-kit-sessions = { path = "../agent-kit-sessions" }
agent-kit-store-sqlite = { path = "../agent-kit-store-sqlite" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
futures-util = "0.3"

[lints]
workspace = true

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"
    />
    <meta name="color-scheme" content="dark" />
    <meta http-equiv="x-dns-prefetch-control" content="off" />
    <title>{{title}}</title>
    <style>
      :root {
        --window-padding: 24px;
        color-scheme: dark;
        color: #f5f5f5;
        background: #000;
        font:
          14px/1.5 system-ui,
          sans-serif;
        user-select: none;
      }

      body {
        box-sizing: border-box;
        display: grid;
        grid-template-rows: minmax(min-content, 1fr) auto;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 40px var(--window-padding) 20px;
        text-align: center;
      }

      body::before {
        position: fixed;
        inset: 0 0 auto;
        height: 36px;
        content: "";
        -webkit-app-region: drag;
      }

      main {
        width: 100%;
      }

      .symbol svg {
        display: block;
        width: 32px;
        height: 32px;
        margin: 0 auto 18px;
      }

      .symbol svg,
      a {
        -webkit-user-drag: none;
      }

      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 500;
        letter-spacing: -0.03em;
        line-height: 1.2;
      }

      p {
        max-width: 270px;
        margin: 10px auto 0;
        color: #c4c4c4;
        font-size: 13px;
        overflow-wrap: anywhere;
      }

      .activity {
        width: min(168px, 100%);
        height: 3px;
        margin: 20px auto 0;
        overflow: hidden;
        border-radius: 999px;
        background: #3a3a3a;
      }

      .activity::before {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: #f5f5f5;
        content: "";
        animation: sweep 1.4s linear infinite;
      }

      @keyframes sweep {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .activity {
          background: #888;
        }

        .activity::before {
          display: none;
        }
      }

      .footer {
        display: grid;
        justify-items: center;
        gap: 6px;
        width: 100%;
        padding-top: 16px;
      }

      .detail {
        color: #8c8c8c;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        overflow-wrap: anywhere;
      }

      a {
        padding: 5px 8px;
        border-radius: 8px;
        color: #b3b3b3;
        font-size: 13px;
        text-decoration: none;
      }

      a:hover {
        color: #fff;
      }

      .footer > a:hover {
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }

      a:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 3px;
      }

      .primary {
        width: 100%;
      }

      .primary a {
        display: block;
        padding: 9px 20px;
        background: #fff;
        color: #000;
        font-size: 12px;
        font-weight: 600;
      }

      .primary a:hover {
        background: #e6e6e6;
      }
    </style>
  </head>
  <body>
    <main id="grida-desktop-update-page">
      <div class="symbol" aria-hidden="true">{{symbol}}</div>
      <h1 id="update-status">{{title}}</h1>
      {{message}} {{activity}}
    </main>
    {{footer}}
  </body>
</html>

<!doctype html>
<!-- GRIDA-SEC-008 — self-contained OAuth callback page bundled with Desktop Main. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Signed in with ChatGPT — Grida</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #fafaf9;
        --foreground: #18181b;
        --muted: #616166;
        --error-background: #fbefdf;
      }

      body {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 100vh;
        margin: 0;
        color: var(--foreground);
        background: var(--background);
        font-family: system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .brand {
        display: flex;
        padding: 20px 24px;
      }

      .brand-logo {
        width: 18px;
        height: 18px;
      }

      main {
        display: grid;
        place-items: center;
        padding: 24px 24px 84px;
      }

      .result {
        max-width: 26rem;
        text-align: center;
      }

      .provider-mark {
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        margin: 0 auto 20px;
        border-radius: 50%;
      }

      .provider-mark svg {
        grid-area: 1 / 1;
      }

      .success-check {
        display: none;
      }

      [data-outcome="error"] .provider-mark {
        background: var(--error-background);
      }

      @media (prefers-reduced-motion: no-preference) {
        [data-outcome="success"] .success-check {
          display: block;
          animation: sweep-check-out 220ms ease-in 840ms forwards;
        }

        [data-outcome="success"] .success-check path {
          stroke-dasharray: 1;
          animation: draw-check 280ms ease-out both;
        }

        [data-outcome="success"] :is(.provider-logo, #page-message) {
          animation: sweep-in 260ms ease-out 910ms both;
        }

        [data-outcome="success"] #page-message {
          animation-delay: 1470ms;
        }

        @keyframes draw-check {
          from {
            stroke-dashoffset: 1;
          }
          to {
            stroke-dashoffset: 0;
          }
        }

        @keyframes sweep-check-out {
          to {
            opacity: 0;
            transform: translateY(-8px);
          }
        }

        @keyframes sweep-in {
          from {
            opacity: 0;
            transform: translateY(8px);
          }
        }
      }

      h1 {
        margin: 0;
        font-size: clamp(1.5rem, 5vw, 1.875rem);
        font-weight: 600;
        line-height: 1.25;
        letter-spacing: -0.03em;
        text-wrap: balance;
      }

      p {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 0.9375rem;
        line-height: 1.5;
        text-wrap: pretty;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #18181b;
          --foreground: #fafafa;
          --muted: #a1a1aa;
          --error-background: #392c24;
        }
      }
    </style>
  </head>
  <body>
    <header class="brand">
      <svg
        class="brand-logo"
        viewBox="0 0 42 42"
        fill="currentColor"
        role="img"
        aria-label="Grida"
        focusable="false"
      >
        <path
          fill-rule="evenodd"
          clip-rule="evenodd"
          d="M27.6584 13.8687L27.5796 28.2889L41.5271 41.9212V27.7373V27.5009L41.525 27.4989C41.3978 19.9495 35.2382 13.8687 27.6584 13.8687Z"
        />
        <path
          fill-rule="evenodd"
          clip-rule="evenodd"
          d="M26.02 7.17866C19.0948 7.95373 13.7111 13.8284 13.7111 20.9606V27.5797L13.9475 42L0 28.3677V13.8687V13.7899L0.000217973 13.7901C0.042516 6.16679 6.23543 0 13.8687 0C19.1022 0 23.6587 2.89894 26.02 7.17866Z"
        />
      </svg>
    </header>
    <main>
      <section
        class="result"
        data-outcome="success"
        role="status"
        aria-labelledby="page-title"
        aria-describedby="page-message"
      >
        <div class="provider-mark" role="img" aria-label="OpenAI">
          <svg
            class="success-check"
            width="28"
            height="28"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="m5 12 4 4L19 6" pathLength="1" />
          </svg>
          <svg
            class="provider-logo"
            width="28"
            height="28"
            viewBox="0 0 320 320"
            fill="currentColor"
            aria-hidden="true"
            focusable="false"
          >
            <path

            />
          </svg>
        </div>
        <h1 id="page-title">
          <!-- callback-title -->Signed in with ChatGPT<!-- /callback-title -->
        </h1>
        <p id="page-message">
          <!-- callback-message -->Close this tab and return to Grida.<!-- /callback-message -->
        </p>
      </section>
    </main>
  </body>
</html>
